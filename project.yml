name: NotAKey
options:
  bundleIdPrefix: com.nevelen
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    # One version for the app and its embedded framework; App Store Connect checks both.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "4"
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: 1.39.0
targets:
  TeslaKit:
    type: framework
    platform: iOS
    sources: [TeslaKit]
    dependencies:
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
  NotAKey:
    type: application
    platform: iOS
    sources: [NotAKey]
    dependencies:
      - target: TeslaKit
        embed: true
    info:
      path: NotAKey/Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central]
        UIAppFonts: [Geist-Regular.ttf, Geist-Medium.ttf, Geist-SemiBold.ttf]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # All encryption is Apple's own (CryptoKit, Secure Enclave), which is exempt.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nevelen.notakey
        # iPhone only, portrait: the app is built around the Action Button and a phone-sized layout.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "Not a Key"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Not a Key uses Bluetooth to talk to your car."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Not a Key can ask for Face ID before it unlocks your car."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
      configs:
        # Xcode runs install a separate dev app with its own key, beside the TestFlight build.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.nevelen.notakey.dev
          INFOPLIST_KEY_CFBundleDisplayName: "Not a Key Dev"
  TeslaKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TeslaKitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: TeslaKit
  NotAKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NotAKeyTests
      # Shared with TeslaKitTests so app-level tests drive the same in-process car.
      - TeslaKitTests/FakeVehicle.swift
      - TeslaKitTests/TestVectors.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: NotAKey
schemes:
  NotAKey:
    build:
      targets:
        NotAKey: all
        TeslaKitTests: [test]
        NotAKeyTests: [test]
    test:
      targets: [TeslaKitTests, NotAKeyTests]

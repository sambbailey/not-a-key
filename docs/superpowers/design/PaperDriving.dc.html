<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper · Driving</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111}a:hover{color:#000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F3F1; color: #111111; font-family: 'Geist', sans-serif; padding: 64px 24px 36px; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Model Y</div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #55554F">
      <span style="width: 7px; height: 7px; border-radius: 4px; background: #15803D"></span>
      <span>Driving</span>
      <a href="PaperSettings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; margin: 0 -12px 0 2px; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </a>
    </div>
  </div>

  <div style="margin-top: 32px; display: flex; align-items: flex-end; justify-content: space-between">
    <div style="font-size: 132px; font-weight: 500; line-height: 0.85; letter-spacing: -0.06em">43<span style="font-size: 32px; letter-spacing: -0.01em; font-weight: 400; margin-left: 6px">mph</span></div>
    <div role="img" aria-label="Gear: Drive" style="display: flex; gap: 2px; padding-bottom: 4px">
      <span style="width: 26px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #6B6B66">P</span>
      <span style="width: 26px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #6B6B66">R</span>
      <span style="width: 26px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #6B6B66">N</span>
      <span style="width: 26px; height: 32px; border-radius: 8px; background: #111111; color: #F3F3F1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">D</span>
    </div>
  </div>

  <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 8px">
    <div style="position: relative; height: 6px; border-radius: 3px; background: #DCDCD7">
      <div style="position: absolute; left: 50%; top: 0; width: 18%; height: 6px; border-radius: 0 3px 3px 0; background: #111111"></div>
      <div style="position: absolute; left: calc(50% - 1px); top: -4px; width: 2px; height: 14px; background: #111111"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #55554F">
      <span>Regen</span>
      <span style="color: #111111; font-weight: 500">+18 kW</span>
      <span>Power</span>
    </div>
  </div>

  <div style="margin-top: 28px; padding: 18px; border-radius: 16px; background: #E8E8E4; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #55554F">Heading to</span>
        <span style="font-size: 18px; font-weight: 500">[Destination]</span>
      </div>
      <div style="text-align: right; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 22px; font-weight: 500; letter-spacing: -0.02em">18 min</span>
        <span style="font-size: 13px; color: #55554F">+3 min traffic</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #D4D4CF; padding-top: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #55554F">Distance left</span>
        <span style="font-size: 16px; font-weight: 500">12.4 mi</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #55554F">Battery on arrival</span>
        <span style="font-size: 16px; font-weight: 500">64%</span>
      </div>
    </div>
  </div>

  <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 16px; font-weight: 500">68%</span>
      <span style="font-size: 13px; color: #55554F">210 miles range</span>
    </div>
    <div style="height: 4px; border-radius: 2px; background: #DCDCD7; overflow: hidden">
      <div style="width: 68%; height: 4px; background: #111111"></div>
    </div>
  </div>

  <div style="margin-top: 20px; display: flex; flex-direction: column; border-top: 1px solid #DCDCD7">
    <div style="display: flex; align-items: center; gap: 14px; height: 76px; border-bottom: 1px solid #DCDCD7">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M12 10c0-4 1-7 4-7s2 5-4 7zM14 12c4 0 7 1 7 4s-5 2-7-4zM12 14c0 4-1 7-4 7s-2-5 4-7zM10 12c-4 0-7-1-7-4s5-2 7 4z"></path></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 500">Climate</span>
        <span style="font-size: 13px; color: #55554F">On · 21°</span>
      </div>
      <a href="PaperClimate.dc.html" style="height: 44px; padding: 0 20px; border-radius: 22px; border: 1px solid #111111; color: #111111; font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center; box-sizing: border-box">Adjust</a>
    </div>
    <div style="padding: 14px 0; font-size: 13px; line-height: 1.4; color: #55554F; border-bottom: 1px solid #DCDCD7">Boot, frunk, charge port and doors are off while the car is in gear.</div>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="font-size: 12px; color: #55554F; letter-spacing: 0.02em">Odometer 12,481 mi</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

renderVals() { return {}; }
}
</script>
</body>
</html>

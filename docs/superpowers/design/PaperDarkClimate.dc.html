<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Dark · Climate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EDEDEA}a:hover{color:#fff}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121211; color: #EDEDEA; font-family: 'Geist', sans-serif; padding: 56px 24px 36px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="PaperDark.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EDEDEA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="font-size: 17px; font-weight: 600">Climate</div>
    <div style="width: 44px"></div>
  </div>

  <div style="margin-top: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #2A2A27; border-bottom: 1px solid #2A2A27">
    <div style="padding: 16px 0; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid #2A2A27">
      <span style="font-size: 13px; color: #A3A39C">Inside</span>
      <span style="font-size: 24px; font-weight: 500">18°</span>
    </div>
    <div style="padding: 16px 0 16px 16px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #A3A39C">Outside</span>
      <span style="font-size: 24px; font-weight: 500">11°</span>
    </div>
  </div>

  <div style="margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <span style="font-size: 13px; color: #A3A39C">Set to</span>
    <div style="display: flex; align-items: center; gap: 28px">
      <button aria-label="Cooler" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid #5A5A55; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EDEDEA" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
      <div style="font-size: 120px; font-weight: 500; line-height: 1; letter-spacing: -0.06em; width: 150px; text-align: center">21<span style="font-size: 40px; font-weight: 400; vertical-align: top">°</span></div>
      <button aria-label="Warmer" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid #5A5A55; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EDEDEA" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
      </button>
    </div>
  </div>

  <div style="margin-top: 40px; display: flex; flex-direction: column; border-top: 1px solid #2A2A27">
    <label style="display: flex; align-items: center; gap: 14px; height: 68px; border-bottom: 1px solid #2A2A27">
      <span style="flex-grow: 1; font-size: 16px; font-weight: 500">Defrost</span>
      <input type="checkbox" style="width: 22px; height: 22px; accent-color: #EDEDEA">
    </label>
    <div style="padding: 16px 0; border-bottom: 1px solid #2A2A27; display: flex; flex-direction: column; gap: 12px">
      <span id="keep-label" style="font-size: 16px; font-weight: 500">Keep climate on</span>
      <div role="group" aria-labelledby="keep-label" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <button aria-pressed="false" style="height: 44px; border-radius: 22px; border: 1px solid #5A5A55; background: transparent; color: #EDEDEA; font-size: 14px; font-weight: 500">Off</button>
        <button aria-pressed="false" style="height: 44px; border-radius: 22px; border: 1px solid #5A5A55; background: transparent; color: #EDEDEA; font-size: 14px; font-weight: 500">Keep</button>
        <button aria-pressed="true" style="height: 44px; border-radius: 22px; border: 0; background: #EDEDEA; color: #121211; font-size: 14px; font-weight: 500">Dog</button>
        <button aria-pressed="false" style="height: 44px; border-radius: 22px; border: 1px solid #5A5A55; background: transparent; color: #EDEDEA; font-size: 14px; font-weight: 500">Camp</button>
      </div>
      <span style="font-size: 13px; line-height: 1.4; color: #A3A39C">The car's screen shows the cabin temperature so passers-by know your pet is fine. Stops below 20%.</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="height: 56px; border-radius: 28px; border: 0; background: #EDEDEA; color: #121211; font-size: 16px; font-weight: 500">Start climate</button>
  <div style="margin-top: 12px; text-align: center; font-size: 12px; color: #A3A39C">Wakes the car once over Bluetooth</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>

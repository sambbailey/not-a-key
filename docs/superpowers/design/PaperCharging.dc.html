<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper · Charging</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111}a:hover{color:#000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F3F1; color: #111111; font-family: 'Geist', sans-serif; padding: 64px 24px 36px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Paper.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="font-size: 17px; font-weight: 600">Charging</div>
    <div style="width: 44px"></div>
  </div>

  <div style="margin-top: 32px; display: flex; align-items: flex-end; justify-content: space-between">
    <div style="font-size: 132px; font-weight: 500; line-height: 0.85; letter-spacing: -0.06em">62<span style="font-size: 40px; letter-spacing: -0.02em; font-weight: 400">%</span></div>
    <div style="text-align: right; padding-bottom: 6px">
      <div style="font-size: 28px; font-weight: 500; letter-spacing: -0.02em">1 h 20</div>
      <div style="font-size: 13px; color: #55554F">to 80%</div>
    </div>
  </div>

  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 6px">
    <div style="position: relative; height: 14px"><span style="position: absolute; left: 80%; transform: translateX(-50%); font-size: 11px; font-weight: 500; line-height: 14px; color: #15803D">80%</span></div>
    <div role="img" aria-label="62% charged, charging to 80%" style="position: relative; height: 10px; border-radius: 5px; background: #DCDCD7; overflow: hidden">
      <div style="position: absolute; left: 0; top: 0; width: 80%; height: 10px; background: #15803D; opacity: 0.22"></div>
      <div style="position: absolute; left: 0; top: 0; width: 62%; height: 10px; border-radius: 0 5px 5px 0; background: #15803D"></div>
      <div style="position: absolute; left: 80%; top: 0; width: 2px; height: 10px; background: #F3F3F1"></div>
    </div>
  </div>
  <div style="margin-top: 10px; display: flex; justify-content: space-between; font-size: 13px; color: #55554F">
    <span>191 mi range</span>
    <span>Limit 80%</span>
  </div>

  <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #DCDCD7">
    <div style="padding: 14px 0; border-bottom: 1px solid #DCDCD7; border-right: 1px solid #DCDCD7; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #55554F">Power</span>
      <span style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em">7 kW</span>
    </div>
    <div style="padding: 14px 0 14px 16px; border-bottom: 1px solid #DCDCD7; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #55554F">Adding</span>
      <span style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em">28 mi/h</span>
    </div>
    <div style="padding: 14px 0; border-bottom: 1px solid #DCDCD7; border-right: 1px solid #DCDCD7; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #55554F">Added</span>
      <span style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em">14.2 kWh</span>
    </div>
    <div style="padding: 14px 0 14px 16px; border-bottom: 1px solid #DCDCD7; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #55554F">Charger</span>
      <span style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em">32 A · 230 V</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; min-height: 76px; border-bottom: 1px solid #DCDCD7">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 500">Charge limit</span>
      <span style="font-size: 13px; color: #55554F">Daily</span>
    </div>
    <button aria-label="Lower limit" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #111111; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
    </button>
    <span style="width: 52px; text-align: center; font-size: 20px; font-weight: 500">80%</span>
    <button aria-label="Raise limit" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #111111; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
    </button>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="height: 56px; border-radius: 28px; border: 0; background: #111111; color: #F3F3F1; font-size: 16px; font-weight: 500">Stop charging</button>
  <button style="margin-top: 8px; height: 48px; border: 0; background: transparent; color: #111111; font-size: 15px; font-weight: 500">Unlock cable</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>

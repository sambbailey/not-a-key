<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Dark · No power details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EDEDEA}a:hover{color:#fff}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121211; color: #EDEDEA; font-family: 'Geist', sans-serif; padding: 56px 24px 36px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="PaperDarkHomeNoPower.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EDEDEA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="font-size: 17px; font-weight: 600">Charging</div>
    <div style="width: 44px"></div>
  </div>

  <div style="margin-top: 32px; display: flex; align-items: flex-end; justify-content: space-between">
    <div style="font-size: 132px; font-weight: 500; line-height: 0.85; letter-spacing: -0.06em">27<span style="font-size: 40px; letter-spacing: -0.02em; font-weight: 400">%</span></div>
    <div style="text-align: right; padding-bottom: 6px">
      <div style="font-size: 28px; font-weight: 500; letter-spacing: -0.02em; color: #F59E0B">0 kW</div>
      <div style="font-size: 13px; color: #A3A39C">not charging</div>
    </div>
  </div>
  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 6px">
    <div role="img" aria-label="27% charged, limit 80%" style="position: relative; height: 10px; border-radius: 5px; background: #2A2A27; overflow: hidden">
      <div style="position: absolute; left: 0; top: 0; width: 27%; height: 10px; border-radius: 0 5px 5px 0; background: #EDEDEA"></div>
      <div style="position: absolute; left: 80%; top: 0; width: 2px; height: 10px; background: #121211"></div>
    </div>
  </div>
  <div style="margin-top: 10px; display: flex; justify-content: space-between; font-size: 13px; color: #A3A39C">
    <span>83 mi range</span>
    <span>Limit 80%</span>
  </div>

  <div role="status" style="margin-top: 24px; padding: 16px; border-radius: 14px; background: #241C0E; border: 1px solid #5C3F0B; display: flex; gap: 12px; align-items: flex-start">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M9 2v5M15 2v5"></path><path d="M6 7h12v4a6 6 0 0 1-12 0z"></path><path d="M12 17v5"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 500">Charger isn't supplying power</span>
      <span style="font-size: 13px; line-height: 1.45; color: #C9C9C2">The cable is connected, but no power is coming through. Check the charger is switched on, or look at its own app or timer.</span>
    </div>
  </div>

  <div style="margin-top: 20px; display: flex; flex-direction: column; border-top: 1px solid #2A2A27">
    <div style="display: flex; align-items: center; gap: 14px; min-height: 72px; border-bottom: 1px solid #2A2A27">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 500">Charge limit</span>
        <span style="font-size: 13px; color: #A3A39C">Daily</span>
      </div>
      <button aria-label="Lower limit" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #5A5A55; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEDEA" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
      <span style="width: 52px; text-align: center; font-size: 20px; font-weight: 500">80%</span>
      <button aria-label="Raise limit" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #5A5A55; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEDEA" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; min-height: 72px; border-bottom: 1px solid #2A2A27">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 500">Charging current</span>
        <span style="font-size: 13px; color: #A3A39C">Up to 32 A</span>
      </div>
      <button aria-label="Lower current" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #5A5A55; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEDEA" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
      <span style="width: 52px; text-align: center; font-size: 20px; font-weight: 500">16 A</span>
      <button aria-label="Raise current" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #5A5A55; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEDEA" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
      </button>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="height: 56px; border-radius: 28px; border: 1px solid #5A5A55; background: transparent; color: #EDEDEA; font-size: 16px; font-weight: 500">Unlock cable</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
